const num = (n) => Number(n || 0).toLocaleString('en-US');
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  return d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function timeAgo(iso) {
  if (!iso) return '—';
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (isNaN(s) || s < 0) return 'just now';
  if (s < 60) return 'just now';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  const d = Math.floor(h / 24);
  if (d < 30) return d + 'd ago';
  return fmtDate(iso);
}
function prettyJSON(v) {
  try {
    const o = typeof v === 'string' ? JSON.parse(v) : v;
    return JSON.stringify(o, null, 2);
  } catch (e) { return String(v ?? ''); }
}
function truncate(s, n) {
  s = String(s ?? '');
  return s.length > n ? s.slice(0, n - 1) + '…' : s;
}
function hostOf(url) {
  try { return new URL(url).hostname; } catch (e) { return String(url || ''); }
}

/* ---------------- mock backend (PREVIEW ONLY) ---------------- */
const mockDB = JSON.parse(JSON.stringify(SAMPLE_DATA));
let mockSeq = 100;
const mockTenant = (id) => mockDB.tenants.find((t) => t.id === id);
const tenantSummary = (t) => ({ id: t.id, name: t.name, website: t.website, brand_color: t.brand_color, created_at: t.created_at });
const tenantDetail = (t) => ({ id: t.id, name: t.name, website: t.website, brand_color: t.brand_color, created_at: t.created_at, welcome_message: t.welcome_message, trigger: t.trigger });

function mockApi(method, path, body) {
  const seg = (re) => path.match(re);
  let m;
  // tenants collection
  if (path === '/api/tenants' && method === 'GET') return mockDB.tenants.map(tenantSummary);
  if (path === '/api/tenants' && method === 'POST') {
    const t = {
      id: 't_' + (mockSeq++), name: body.name, website: body.website, brand_color: body.brand_color || '#6366f1',
      created_at: new Date().toISOString(), welcome_message: body.welcome_message || '',
      trigger: body.trigger || { enabled: false, pages: [], delay_sec: 10, message: '' },
      pages: [], tools: [], actions: [], unanswered: [],
      analytics: { top_questions: [], tool_calls: [], unresolved_conversations: 0, total_conversations: 0 }
    };
    mockDB.tenants.push(t);
    return tenantDetail(t);
  }
  // ingest
  if ((m = seg(/^\/api\/tenants\/([^/]+)\/ingest$/)) && method === 'POST') {
    const t = mockTenant(m[1]); if (!t) throw new Error('Tenant not found');
    if (!t._ingestedOnce) {
      t._ingestedOnce = true;
      const base = (t.website || '').replace(/\/$/, '');
      t.pages.push({
        url: base + '/', title: t.name + ' — Home', crawled_at: new Date().toISOString(),
        extracted: {
          products: [{ name: 'Sample Product', price: 'Rs 9,999', specs: ['Demo spec one', 'Demo spec two'], stock: 'In stock (10)' }],
          faqs: [{ q: 'What are your opening hours?', a: 'Demo answer — replace after a real crawl.' }],
          policies: [{ type: 'Shipping', text: 'Demo policy — replace after a real crawl.' }]
        }
      });
      t.pages.push({
        url: base + '/about', title: 'About — ' + t.name, crawled_at: new Date().toISOString(),
        extracted: { products: [], faqs: [{ q: 'Where are you located?', a: 'Demo answer — replace after a real crawl.' }], policies: [] }
      });
    }
    return { pages_crawled: 14, products_found: 32 };
  }
  // upload
  if ((m = seg(/^\/api\/tenants\/([^/]+)\/upload$/)) && method === 'POST') {
    const t = mockTenant(m[1]); if (!t) throw new Error('Tenant not found');
    return { files_indexed: (body && body.__files) || 0 };
  }
  // seed demo
  if ((m = seg(/^\/api\/tenants\/([^/]+)\/seed-demo$/)) && method === 'POST') {
    const t = mockTenant(m[1]); if (!t) throw new Error('Tenant not found');
    t.pages = t.pages.filter((p) => p.url !== 'demo://catalog');
    t.pages.push({
      url: 'demo://catalog', title: 'Demo Catalog — 12 products', crawled_at: new Date().toISOString(),
      extracted: { products: DEMO_CATALOG_PRODUCTS.map((p) => ({ ...p, specs: [...p.specs] })), faqs: [], policies: [] }
    });
    return { ok: true, products: 12 };
  }
  // pages
  if ((m = seg(/^\/api\/tenants\/([^/]+)\/pages$/)) && method === 'GET') {
    const t = mockTenant(m[1]); if (!t) throw new Error('Tenant not found');
    return t.pages;
  }
  // tools collection
  if ((m = seg(/^\/api\/tenants\/([^/]+)\/tools$/)) && method === 'GET') {
    const t = mockTenant(m[1]); if (!t) throw new Error('Tenant not found');
    return t.tools;
  }
  if ((m = seg(/^\/api\/tenants\/([^/]+)\/tools$/)) && method === 'POST') {
    const t = mockTenant(m[1]); if (!t) throw new Error('Tenant not found');
    const tool = { id: 'tool_' + (mockSeq++), name: body.name, description: body.description, params_schema: body.params_schema, webhook_url: body.webhook_url, enabled: body.enabled !== false };
    t.tools.push(tool);
    return tool;
  }
  // single tool
  if ((m = seg(/^\/api\/tenants\/([^/]+)\/tools\/([^/]+)$/)) && method === 'PUT') {
    const t = mockTenant(m[1]); if (!t) throw new Error('Tenant not found');
    const tool = t.tools.find((x) => x.id === m[2]); if (!tool) throw new Error('Tool not found');
    Object.assign(tool, { name: body.name, description: body.description, params_schema: body.params_schema, webhook_url: body.webhook_url, enabled: body.enabled });
    return tool;
  }
  if ((m = seg(/^\/api\/tenants\/([^/]+)\/tools\/([^/]+)$/)) && method === 'DELETE') {
    const t = mockTenant(m[1]); if (!t) throw new Error('Tenant not found');
    t.tools = t.tools.filter((x) => x.id !== m[2]);
    return { ok: true };
  }
  // actions
  if ((m = seg(/^\/api\/tenants\/([^/]+)\/actions/)) && method === 'GET') {
    const t = mockTenant(m[1]); if (!t) throw new Error('Tenant not found');
    return t.actions.slice(0, 50);
  }
  // unanswered
  if ((m = seg(/^\/api\/tenants\/([^/]+)\/unanswered$/)) && method === 'GET') {
    const t = mockTenant(m[1]); if (!t) throw new Error('Tenant not found');
    return t.unanswered;
  }
  if ((m = seg(/^\/api\/tenants\/([^/]+)\/unanswered\/([^/]+)\/answer$/)) && method === 'POST') {
    const t = mockTenant(m[1]); if (!t) throw new Error('Tenant not found');
    const q = t.unanswered.find((x) => x.id === m[2]); if (!q) throw new Error('Question not found');
    q.answered = true; q.answer_text = body.answer;
    return { ok: true };
  }
  // analytics
  if ((m = seg(/^\/api\/tenants\/([^/]+)\/analytics$/)) && method === 'GET') {
    const t = mockTenant(m[1]); if (!t) throw new Error('Tenant not found');
    return t.analytics;
  }
  // tenant detail / update / delete
  if ((m = seg(/^\/api\/tenants\/([^/]+)$/)) && method === 'GET') {
    const t = mockTenant(m[1]); if (!t) throw new Error('Tenant not found');
    return tenantDetail(t);
  }
  if ((m = seg(/^\/api\/tenants\/([^/]+)$/)) && method === 'PUT') {
    const t = mockTenant(m[1]); if (!t) throw new Error('Tenant not found');
    Object.assign(t, { name: body.name, website: body.website, brand_color: body.brand_color, welcome_message: body.welcome_message, trigger: body.trigger });
    return tenantDetail(t);
  }
  if ((m = seg(/^\/api\/tenants\/([^/]+)$/)) && method === 'DELETE') {
    mockDB.tenants = mockDB.tenants.filter((t) => t.id !== m[1]);
    return { ok: true };
  }
  throw new Error('Unknown endpoint: ' + method + ' ' + path);
}

/* ---------------- API client (same origin) ---------------- */
async function api(method, path, body) {
  if (PREVIEW) { await new Promise((r) => setTimeout(r, 180)); return mockApi(method, path, body); }
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  let res;
  try { res = await fetch(path, opts); }
  catch (e) { throw new Error('Network error — is the backend running on this origin?'); }
  if (!res.ok) {
    let msg = 'Request failed (' + res.status + ')';
    try { const j = await res.json(); if (j && (j.error || j.message)) msg = j.error || j.message; } catch (e) {}
    throw new Error(msg);
  }
  if (res.status === 204) return {};
  return res.json();
}
const apiGet = (p) => api('GET', p);
const apiPost = (p, b) => api('POST', p, b);
const apiPut = (p, b) => api('PUT', p, b);
const apiDel = (p) => api('DELETE', p);

async function apiUpload(tenantId, files) {
  if (PREVIEW) { await new Promise((r) => setTimeout(r, 300)); return mockApi('POST', '/api/tenants/' + tenantId + '/upload', { __files: files.length }); }
  const fd = new FormData();
  Array.from(files).forEach((f) => fd.append('files', f));
  let res;
  try { res = await fetch('/api/tenants/' + tenantId + '/upload', { method: 'POST', body: fd }); }
  catch (e) { throw new Error('Network error — is the backend running on this origin?'); }
  if (!res.ok) throw new Error('Upload failed (' + res.status + ')');
  return res.json();
}

    : 'bg-red-50 text-red-700 ring-red-200';
  return '<span class="badge whitespace-nowrap font-mono ring-1 ' + cls + '">' + num(ms) + ' ms</span>';
}
function renderActions() {

      '<span class="badge bg-slate-100 text-slate-600">last ' + num(Math.min(actions.length, 50)) + '</span>' +

        '<th class="th !text-slate-400">Time</th><th class="th !text-slate-400">Tool</th><th class="th !text-slate-400">Params</th><th class="th !text-slate-400">Result</th><th class="th !text-slate-400 text-right">Duration</th>' +
      '</tr></thead><tbody class="divide-y divide-slate-100">';

        '<td class="td whitespace-nowrap"><div class="font-mono text-xs text-slate-500" title="' + esc(fmtDate(a.created_at)) + '">' + esc(timeAgo(a.created_at)) + '</div></td>' +
        '<td class="td"><span class="inline-block whitespace-nowrap rounded-md bg-slate-900 px-2 py-1 font-mono text-xs font-semibold text-emerald-300">' + esc(a.tool_name) + '</span></td>' +

          '<pre class="code mt-1.5 max-h-44 overflow-auto rounded-lg bg-slate-950 p-2.5 font-mono text-[11px] leading-relaxed text-slate-200">' + esc(paramsPretty) + '</pre></details></td>' +
        '<td class="td"><details class="coll max-w-[300px]"><summary class="cursor-pointer font-mono text-xs text-slate-600 hover:text-slate-900" title="Click to expand">' + esc(resultShort) + '</summary>' +
          '<pre class="code mt-1.5 max-h-44 overflow-auto whitespace-pre-wrap rounded-lg bg-slate-50 p-2.5 font-mono text-[11px] leading-relaxed text-slate-700 ring-1 ring-slate-200">' + esc(resultPretty) + '</pre></details></td>' +
        '<td class="td text-right">' + durationBadge(a.duration_ms) + '</td>' +

          '<span>first asked ' + esc(timeAgo(q.created_at)) + '</span>' +
        '</div>' +

        '<span class="badge shrink-0 bg-amber-50 text-amber-800 ring-1 ring-amber-200">asked ' + num(q.count) + '×</span>' +
      '</div>' +
      '<div class="mt-2 flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-slate-500">' +
        '<a href="' + esc(q.page_url) + '" target="_blank" rel="noopener" class="truncate font-mono text-indigo-600 hover:underline">' + esc(q.page_url) + '</a>' +
        '<span class="text-slate-400">first asked ' + esc(timeAgo(q.created_at)) + '</span>' +
      '</div>' +
      '<div class="mt-4">' +
        '<label class="label" for="ans-' + esc(q.id) + '">Canonical answer</label>' +
        '<textarea id="ans-' + esc(q.id) + '" rows="3" class="input" placeholder="Write the definitive answer the agent should give from now on…"></textarea>' +
        '<div class="mt-3 flex justify-end">' +
          '<button class="btn-primary" id="ansbtn-' + esc(q.id) + '" onclick="UI.answerQuestion(\'' + esc(q.id) + '\')">' +
            '<svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>' +

function statCard({ label, value, sub, icon, tint }) {
  return '<div class="card p-5"><div class="flex items-start justify-between">' +
    '<div><div class="text-[11px] font-bold uppercase tracking-wider text-slate-400">' + esc(label) + '</div>' +
    '<div class="mt-1 text-3xl font-extrabold tracking-tight text-slate-900">' + esc(value) + '</div>' +
    (sub ? '<div class="mt-1 text-xs text-slate-500">' + esc(sub) + '</div>' : '') + '</div>' +
    '<div class="flex h-10 w-10 items-center justify-center rounded-xl ' + tint + '">' + icon + '</div>' +
  '</div></div>';
}
function renderAnalytics() {
  const a = state.analytics || { top_questions: [], tool_calls: [], unresolved_conversations: 0, total_conversations: 0 };
  const topQ = a.top_questions || [], toolCalls = a.tool_calls || [];
  const maxTool = Math.max(1, ...toolCalls.map((t) => t.count));
  const resolutionRate = a.total_conversations ? Math.round(((a.total_conversations - a.unresolved_conversations) / a.total_conversations) * 100) : 0;
  let html = '<div class="grid gap-4 sm:grid-cols-3">' +
    statCard({ label: 'Total conversations', value: num(a.total_conversations), sub: 'all time', tint: 'bg-indigo-50 text-indigo-600',
      icon: '<svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>' }) +
    statCard({ label: 'Unresolved', value: num(a.unresolved_conversations), sub: resolutionRate + '% resolution rate', tint: 'bg-amber-50 text-amber-600',
      icon: '<svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>' }) +
    statCard({ label: 'Unanswered questions', value: num(openUnansweredCount()), sub: 'awaiting your answer', tint: 'bg-red-50 text-red-600',
      icon: '<svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8.3 10.5a3.5 3.5 0 115.9 2.6c-.8.8-2.2 1.4-2.2 3.4m0 3.5h.01"/></svg>' }) +
  '</div>';
  html += '<div class="mt-5 grid gap-5 lg:grid-cols-2">' +
    // top questions
    '<div class="card p-5"><h3 class="text-sm font-bold text-slate-900">Top questions</h3><p class="mb-4 text-xs text-slate-500">What visitors ask most — feed these into FAQs or tools.</p>';
  if (!topQ.length) html += '<div class="py-6 text-center text-sm italic text-slate-400">No conversation data yet.</div>';
  else {
    html += '<ol class="space-y-3">' + topQ.map((q, i) =>
      '<li class="flex items-center gap-3">' +
        '<span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg ' + (i < 3 ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-500') + ' text-xs font-bold">' + (i + 1) + '</span>' +
        '<span class="min-w-0 flex-1 truncate text-sm text-slate-700" title="' + esc(q.question) + '">' + esc(q.question) + '</span>' +
        '<span class="badge shrink-0 bg-slate-100 font-mono text-slate-600">' + num(q.count) + '</span>' +
      '</li>').join('') + '</ol>';
  }
  html += '</div>' +
    // tool calls
    '<div class="card p-5"><h3 class="text-sm font-bold text-slate-900">Tool calls</h3><p class="mb-4 text-xs text-slate-500">How often each webhook tool fires.</p>';
  if (!toolCalls.length) html += '<div class="py-6 text-center text-sm italic text-slate-400">No tool calls yet.</div>';
  else {
    html += '<div class="space-y-4">' + toolCalls.map((tc) => {
      const pct = Math.round((tc.count / maxTool) * 100);
      return '<div><div class="mb-1.5 flex items-center justify-between gap-2">' +
        '<span class="truncate font-mono text-[13px] font-semibold text-slate-800">' + esc(tc.tool_name) + '</span>' +
        '<span class="shrink-0 font-mono text-xs text-slate-500">' + num(tc.count) + ' calls</span></div>' +
        '<div class="h-2.5 overflow-hidden rounded-full bg-slate-100"><div class="h-full rounded-full bg-gradient-to-r from-indigo-500 to-violet-500 transition-all" style="width:' + pct + '%"></div></div></div>';
    }).join('') + '</div>';
  }
  html += '</div></div>';
  return html;
}

  const steps = [
    { title: 'Paste the snippet on your site', desc: 'Add it just before the closing </body> tag on every page — or once via Google Tag Manager.' },
    { title: 'Crawl your content', desc: 'Run “Crawl & index” in Data Sources so the agent answers from your real pages, products, and policies.' },
    { title: 'Wire up a webhook tool (optional)', desc: 'Define at least one custom tool — e.g. check_stock or create_order — so the agent can act, not just chat.' }
  ];
  let html = '<div class="card p-5 sm:p-6">' +
    '<h3 class="text-sm font-bold text-slate-900">Embed the widget</h3>' +
    '<p class="mt-1 text-sm text-slate-500">One script tag is all it takes. It inherits this tenant’s brand color, welcome message, and trigger settings.</p>' +
    '<div class="relative mt-4">' +
      '<pre id="embed-code" class="code overflow-x-auto rounded-xl bg-slate-950 p-4 pr-16 font-mono text-[12.5px] leading-relaxed text-emerald-300"></pre>' +
      '<button class="btn-secondary absolute right-3 top-3 !px-3 !py-1.5 !text-xs" onclick="UI.copyEmbed()">' +
        '<svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>' +
        '<span id="copy-label">Copy</span>' +
      '</button>' +
    '</div>' +
    '<div class="mt-3 flex flex-wrap gap-2 text-xs">' +
      '<span class="badge bg-slate-100 text-slate-600">data-tenant <span class="font-mono font-bold text-slate-800">' + esc(t.id) + '</span></span>' +
      '<span class="badge bg-slate-100 text-slate-600">data-color <span class="font-mono font-bold" style="color:' + esc(t.brand_color || '#6366f1') + '">' + esc(t.brand_color || '#6366f1') + '</span></span>' +
    '</div>' +
  '</div>';
  html += '<div class="card mt-5 p-5 sm:p-6"><h3 class="text-sm font-bold text-slate-900">Go-live checklist</h3><p class="mb-4 text-xs text-slate-500">Three steps to a live AI agent on ' + esc(hostOf(t.website)) + '.</p><div class="space-y-3">';
  steps.forEach((s, i) => {
    const done = state.checkedSteps.has(t.id + ':' + i);
    html += '<button onclick="UI.toggleChecklist(' + i + ')" class="flex w-full items-start gap-3 rounded-xl border p-4 text-left transition ' + (done ? 'border-emerald-200 bg-emerald-50/50' : 'border-slate-200 bg-white hover:border-indigo-200 hover:bg-indigo-50/30') + '">' +
      '<span class="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full border-2 transition ' + (done ? 'border-emerald-500 bg-emerald-500 text-white' : 'border-slate-300 text-transparent') + '">' +
        '<svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg></span>' +
      '<span><span class="block text-sm font-semibold ' + (done ? 'text-slate-500 line-through' : 'text-slate-900') + '"><span class="mr-1.5 font-mono text-xs text-slate-400">' + (i + 1) + '</span>' + esc(s.title) + '</span>' +
      '<span class="mt-0.5 block text-xs text-slate-500">' + esc(s.desc) + '</span></span>' +
    '</button>';
  });
  html += '</div></div>';
  // fill the code block as text (avoids HTML-escaping pitfalls)
  setTimeout(() => { const el = $('#embed-code'); if (el) el.textContent = embedSnippet(); }, 0);
  return html;
}

/* ================= TENANT MODAL ================= */
const COLOR_SWATCHES = ['#6366f1', '#0d9488', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#22c55e', '#ec4899'];
function renderTenantModal(edit) {
  const d = edit ? state.tenantDetail : null;
  const trig = (d && d.trigger) || { enabled: false, pages: [], delay_sec: 10, message: '' };
  const color = (d && d.brand_color) || '#6366f1';
  openModal(
    '<div class="border-b border-slate-100 px-6 py-4"><h3 class="text-base font-bold text-slate-900">' + (edit ? 'Edit tenant' : 'New tenant') + '</h3>' +
    '<p class="text-xs text-slate-500">' + (edit ? 'Update this tenant’s identity and widget behavior.' : 'Set up a new website for the AI agent to serve.') + '</p></div>' +
    '<div class="space-y-4 px-6 py-5">' +
      '<div class="grid gap-4 sm:grid-cols-2">' +
        '<div><label class="label" for="f_name">Business name *</label><input id="f_name" class="input" placeholder="Nova Electronics" value="' + esc(d ? d.name : '') + '"></div>' +
        '<div><label class="label" for="f_website">Website *</label><input id="f_website" class="input font-mono" type="url" placeholder="https://example.com" value="' + esc(d ? d.website : '') + '"></div>' +
      '</div>' +
      '<div><label class="label" for="f_color">Brand color</label>' +
        '<div class="flex items-center gap-3">' +
          '<input id="f_color" type="color" value="' + esc(color) + '" class="h-10 w-14 cursor-pointer rounded-lg border border-slate-300 bg-white p-1">' +
          '<div class="flex flex-wrap gap-1.5">' + COLOR_SWATCHES.map((c) =>
            '<button type="button" onclick="document.getElementById(\'f_color\').value=\'' + c + '\'" class="h-7 w-7 rounded-full ring-2 ring-offset-1 transition hover:scale-110" style="background:' + c + ';--tw-ring-color:#e2e8f0" title="' + c + '"></button>'
          ).join('') + '</div>' +
        '</div></div>' +
      '<div><label class="label" for="f_welcome">Welcome message</label><textarea id="f_welcome" rows="2" class="input" placeholder="Hi! How can I help you today?">' + esc(d ? d.welcome_message : '') + '</textarea></div>' +
      '<div class="rounded-xl border border-slate-200 bg-slate-50/60 p-4">' +
        '<label class="flex cursor-pointer items-center justify-between"><span class="text-sm font-semibold text-slate-800">Proactive trigger</span>' +
        '<span class="relative inline-flex cursor-pointer items-center"><input id="f_trig_enabled" type="checkbox" class="peer sr-only"' + (trig.enabled ? ' checked' : '') + '>' +
        '<span class="block h-6 w-11 rounded-full bg-slate-300 transition-colors peer-checked:bg-indigo-600"></span>' +
        '<span class="pointer-events-none absolute left-0.5 top-0.5 h-5 w-5 rounded-full bg-white shadow transition-transform peer-checked:translate-x-5"></span></span></label>' +
        '<p class="mt-1 text-xs text-slate-500">Pop the chat open automatically with a nudge message.</p>' +
        '<div class="mt-3 grid gap-3 sm:grid-cols-2">' +
          '<div><label class="label" for="f_trig_pages">Pages (comma-separated)</label><input id="f_trig_pages" class="input font-mono" placeholder="/, /products" value="' + esc((trig.pages || []).join(', ')) + '"></div>' +
          '<div><label class="label" for="f_trig_delay">Delay (seconds)</label><input id="f_trig_delay" type="number" min="0" max="300" class="input" value="' + esc(trig.delay_sec != null ? trig.delay_sec : 10) + '"></div>' +
        '</div>' +
        '<div class="mt-3"><label class="label" for="f_trig_msg">Trigger message</label><input id="f_trig_msg" class="input" placeholder="Need help finding something?" value="' + esc(trig.message || '') + '"></div>' +
      '</div>' +
    '</div>' +
    '<div class="flex justify-end gap-3 border-t border-slate-100 px-6 py-4">' +
      '<button class="btn-secondary" onclick="UI.closeModal()">Cancel</button>' +
      '<button class="btn-primary" id="tenant-save-btn" onclick="UI.saveTenant(' + (edit ? 'true' : 'false') + ')">' + (edit ? 'Save changes' : 'Create tenant') + '</button>' +
    '</div>'
  );
}

/* ================= TOOL MODAL ================= */
const SCHEMA_EXAMPLE = '{\n  "type": "object",\n  "properties": {\n    "order_id": {\n      "type": "string",\n      "description": "The order ID to look up"\n    }\n  },\n  "required": ["order_id"]\n}';
function renderToolModal(toolId) {
  const tool = toolId ? (state.tools || []).find((x) => x.id === toolId) : null;
  openModal(
    '<div class="border-b border-slate-100 px-6 py-4"><h3 class="text-base font-bold text-slate-900">' + (tool ? 'Edit tool' : 'Add custom tool') + '</h3>' +
    '<p class="text-xs text-slate-500">' + (tool ? 'Update how the agent calls this webhook.' : 'Define a webhook the agent can call mid-conversation.') + '</p></div>' +
    '<div class="space-y-4 px-6 py-5">' +
      '<div class="grid gap-4 sm:grid-cols-2">' +
        '<div><label class="label" for="t_name">Tool name *</label><input id="t_name" class="input font-mono" placeholder="check_stock" value="' + esc(tool ? tool.name : '') + '"></div>' +
        '<div><label class="label" for="t_url">Webhook URL *</label><input id="t_url" class="input font-mono" type="url" placeholder="https://api.example.com/hooks/stock" value="' + esc(tool ? tool.webhook_url : '') + '"></div>' +
      '</div>' +
      '<div><label class="label" for="t_desc">Description *</label><textarea id="t_desc" rows="2" class="input" placeholder="What this tool does — the agent reads this to decide when to call it.">' + esc(tool ? tool.description : '') + '</textarea></div>' +
      '<div><label class="label" for="t_schema">Params JSON schema *</label>' +
      '<textarea id="t_schema" rows="8" spellcheck="false" class="input font-mono !text-xs leading-relaxed">' + esc(tool ? prettyJSON(tool.params_schema) : SCHEMA_EXAMPLE) + '</textarea>' +
      '<p class="mt-1 text-[11px] text-slate-400">Must be valid JSON. The agent fills these params from the conversation.</p></div>' +
      '<label class="flex cursor-pointer items-center gap-3"><span class="relative inline-flex items-center"><input id="t_enabled" type="checkbox" class="peer sr-only"' + (!tool || tool.enabled ? ' checked' : '') + '>' +
      '<span class="block h-6 w-11 rounded-full bg-slate-300 transition-colors peer-checked:bg-indigo-600"></span>' +
      '<span class="pointer-events-none absolute left-0.5 top-0.5 h-5 w-5 rounded-full bg-white shadow transition-transform peer-checked:translate-x-5"></span></span>' +
      '<span class="text-sm font-medium text-slate-700">Enabled — agent may call this tool</span></label>' +
    '</div>' +
    '<div class="flex justify-end gap-3 border-t border-slate-100 px-6 py-4">' +
      '<button class="btn-secondary" onclick="UI.closeModal()">Cancel</button>' +
      '<button class="btn-primary" id="tool-save-btn" onclick="UI.saveTool(' + (tool ? '\'' + esc(tool.id) + '\'' : 'null') + ')">' + (tool ? 'Save changes' : 'Add tool') + '</button>' +
    '</div>', 'max-w-xl'
  );
}

/* ================= UI ACTIONS ================= */
async function loadTenantData(id) {
  const [detail, pages, tools, actions, unanswered, analytics] = await Promise.all([
    apiGet('/api/tenants/' + id),
    apiGet('/api/tenants/' + id + '/pages'),
    apiGet('/api/tenants/' + id + '/tools'),
    apiGet('/api/tenants/' + id + '/actions?limit=50'),
    apiGet('/api/tenants/' + id + '/unanswered'),
    apiGet('/api/tenants/' + id + '/analytics')
  ]);
  Object.assign(state, { tenantDetail: detail, pages, tools, actions, unanswered, analytics });
}

const UI = {
  closeModal,
  _confirmResolve: null,

  toggleSidebar() {
    const sb = $('#sidebar'), ov = $('#sidebar-overlay');
    const open = sb.classList.contains('-translate-x-full');
    sb.classList.toggle('-translate-x-full', !open);
    ov.classList.toggle('hidden', !open);
  },

  async selectTenant(id) {
    if (state.loading && state.currentTenantId === id) return;
    state.currentTenantId = id;
    state.currentTab = state.currentTab || 'sources';
    state.loading = true; state.loadError = null;
    $('#sidebar-overlay').classList.add('hidden');
    $('#sidebar').classList.add('-translate-x-full');
    renderSidebar(); renderHeader(); renderTabs(); renderContent();
    try {
      await loadTenantData(id);
      const t = mockTenantSafe(id);
      if (t) { const s = state.tenants.find((x) => x.id === id); if (s) Object.assign(s, { name: t.name, website: t.website, brand_color: t.brand_color }); }
    } catch (e) {
      state.loadError = e.message;
      toast(e.message, 'error');
    }
    state.loading = false;
    renderSidebar(); renderHeader(); renderTabs(); renderContent();
  },

  setTab(tab) {
    state.currentTab = tab;
    renderTabs(); renderContent();
    $('#content').scrollTop = 0;
  },

  openTenantModal(edit = false) { renderTenantModal(edit); },

  async saveTenant(edit) {
    const btn = $('#tenant-save-btn');
    const name = $('#f_name').value.trim();
    const website = $('#f_website').value.trim();
    if (!name) { toast('Business name is required.', 'error'); $('#f_name').focus(); return; }
    if (!website) { toast('Website URL is required.', 'error'); $('#f_website').focus(); return; }
    const body = {
      name, website,
      brand_color: $('#f_color').value,
      welcome_message: $('#f_welcome').value.trim(),
      trigger: {
        enabled: $('#f_trig_enabled').checked,
        pages: $('#f_trig_pages').value.split(',').map((s) => s.trim()).filter(Boolean),
        delay_sec: Math.max(0, parseInt($('#f_trig_delay').value, 10) || 0),
        message: $('#f_trig_msg').value.trim()
      }
    };
    btn.disabled = true; btn.innerHTML = spinner() + 'Saving…';
    try {
      if (edit) {
        const updated = await apiPut('/api/tenants/' + state.currentTenantId, body);
        const s = state.tenants.find((x) => x.id === state.currentTenantId);
        if (s) Object.assign(s, { name: updated.name, website: updated.website, brand_color: updated.brand_color });
        await loadTenantData(state.currentTenantId);
        toast('Tenant updated.', 'success');
      } else {
        const created = await apiPost('/api/tenants', body);
        state.tenants.push({ id: created.id, name: created.name, website: created.website, brand_color: created.brand_color, created_at: created.created_at });
        toast('Tenant created.', 'success');
        closeModal();
        await UI.selectTenant(created.id);
        return;
      }
      closeModal();
      renderSidebar(); renderHeader(); renderTabs(); renderContent();
    } catch (e) {
      toast(e.message, 'error');
      btn.disabled = false; btn.textContent = edit ? 'Save changes' : 'Create tenant';
    }
  },

  async deleteTenant() {
    const t = currentTenant();
    if (!t) return;
    const ok = await confirmAction({
      title: 'Delete tenant?',
      message: '“' + t.name + '” and all of its crawled data, tools, and logs will be permanently removed.',
      okLabel: 'Delete tenant'
    });
    if (!ok) return;
    try {
      await apiDel('/api/tenants/' + t.id);
      state.tenants = state.tenants.filter((x) => x.id !== t.id);
      toast('Tenant deleted.', 'success');
      if (state.tenants.length) await UI.selectTenant(state.tenants[0].id);
      else {
        state.currentTenantId = null; state.tenantDetail = null;
        state.pages = []; state.tools = []; state.actions = []; state.unanswered = []; state.analytics = null;
        renderSidebar(); renderHeader(); renderTabs(); renderContent();
      }
    } catch (e) { toast(e.message, 'error'); }
  },

  async runCrawl(e) {
    e.preventDefault();
    const t = currentTenant();
    const url = $('#crawl-url').value.trim();
    if (!url || !t) return false;
    state.crawling = true;
    $('#crawl-btn').disabled = true;
    $('#crawl-btn').innerHTML = spinner() + 'Crawling…';
    $('#crawl-result').innerHTML = '';
    try {
      const r = await apiPost('/api/tenants/' + t.id + '/ingest', { website_url: url });
      $('#crawl-result').innerHTML = '<div class="flex items-center gap-2 rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-2 text-sm text-emerald-800">' +
        '<svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>' +
        '<span><strong>' + num(r.pages_crawled) + '</strong> pages crawled · <strong>' + num(r.products_found) + '</strong> products found</span></div>';
      state.pages = await apiGet('/api/tenants/' + t.id + '/pages');
      toast('Crawl complete — knowledge base updated.', 'success');
      renderContent();
    } catch (err) {
      $('#crawl-result').innerHTML = '<div class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">' + esc(err.message) + '</div>';
      toast(err.message, 'error');
    }
    state.crawling = false;
    return false;
  },

  async uploadFiles(input) {
    const t = currentTenant();
    const files = input.files;
    if (!files || !files.length || !t) return;
    state.uploading = true;
    renderContent();
    try {
      const r = await apiUpload(t.id, files);
      $('#upload-result') && ($('#upload-result').innerHTML = '');
      state.pages = await apiGet('/api/tenants/' + t.id + '/pages');
      toast(num(r.files_indexed) + ' file(s) indexed into the knowledge base.', 'success');
    } catch (err) { toast(err.message, 'error'); }
    state.uploading = false;
    input.value = '';
    renderContent();
  },

  async seedDemo() {
    const t = currentTenant();
    if (!t) return;
    try {
      const r = await apiPost('/api/tenants/' + t.id + '/seed-demo', {});
      state.pages = await apiGet('/api/tenants/' + t.id + '/pages');
      toast('Demo catalog seeded — ' + num(r.products) + ' products indexed.', 'success');
      renderContent();
    } catch (e) { toast(e.message, 'error'); }
  },

  openToolModal(toolId = null) { renderToolModal(toolId); },

  async saveTool(toolId) {
    const t = currentTenant();
    const btn = $('#tool-save-btn');
    const name = $('#t_name').value.trim();
    const description = $('#t_desc').value.trim();
    const webhook_url = $('#t_url').value.trim();
    let params_schema;
    try { params_schema = JSON.parse($('#t_schema').value); }
    catch (e) { toast('Params schema is not valid JSON: ' + e.message, 'error'); $('#t_schema').focus(); return; }
    if (!name) { toast('Tool name is required.', 'error'); return; }
    if (!description) { toast('Description is required.', 'error'); return; }
    if (!webhook_url) { toast('Webhook URL is required.', 'error'); return; }
    const body = { name, description, params_schema, webhook_url, enabled: $('#t_enabled').checked };
    btn.disabled = true; btn.innerHTML = spinner() + 'Saving…';
    try {
      if (toolId) { await apiPut('/api/tenants/' + t.id + '/tools/' + toolId, body); toast('Tool updated.', 'success'); }
      else { await apiPost('/api/tenants/' + t.id + '/tools', body); toast('Tool added.', 'success'); }
      state.tools = await apiGet('/api/tenants/' + t.id + '/tools');
      closeModal();
      renderContent();
    } catch (e) {
      toast(e.message, 'error');
      btn.disabled = false; btn.textContent = toolId ? 'Save changes' : 'Add tool';
    }
  },

  async deleteTool(toolId) {
    const t = currentTenant();
    const tool = (state.tools || []).find((x) => x.id === toolId);
    const ok = await confirmAction({
      title: 'Delete tool?',
      message: '“' + (tool ? tool.name : toolId) + '” will be removed. The agent will no longer be able to call it.',
      okLabel: 'Delete tool'
    });
    if (!ok) return;
    try {
      await apiDel('/api/tenants/' + t.id + '/tools/' + toolId);
      state.tools = await apiGet('/api/tenants/' + t.id + '/tools');
      toast('Tool deleted.', 'success');
      renderContent();
    } catch (e) { toast(e.message, 'error'); }
  },

  async toggleTool(toolId, enabled) {
    const t = currentTenant();
    const tool = (state.tools || []).find((x) => x.id === toolId);
    if (!t || !tool) return;
    try {
      const updated = await apiPut('/api/tenants/' + t.id + '/tools/' + toolId, {
        name: tool.name, description: tool.description, params_schema: tool.params_schema,
        webhook_url: tool.webhook_url, enabled
      });
      Object.assign(tool, updated);
      toast('“' + tool.name + '” ' + (enabled ? 'enabled.' : 'disabled.'), 'success');
      renderContent();
    } catch (e) {
      toast(e.message, 'error');
      renderContent();
    }
  },

  async answerQuestion(qid) {
    const t = currentTenant();
    const ta = $('#ans-' + qid);
    const btn = $('#ansbtn-' + qid);
    const answer = ta ? ta.value.trim() : '';
    if (!answer) { toast('Write an answer first — it becomes the canonical response.', 'error'); ta && ta.focus(); return; }
    btn.disabled = true; btn.innerHTML = spinner() + 'Ingesting…';
    try {
      await apiPost('/api/tenants/' + t.id + '/unanswered/' + qid + '/answer', { answer });
      state.unanswered = await apiGet('/api/tenants/' + t.id + '/unanswered');
      toast('Answer ingested — the agent will use it from now on.', 'success');
      renderTabs(); renderContent();
    } catch (e) {
      toast(e.message, 'error');
      btn.disabled = false; btn.innerHTML = 'Answer &amp; ingest into knowledge base';
    }
  },

  copyEmbed() {
    const code = embedSnippet();
    const done = () => {
      const lbl = $('#copy-label');
      if (lbl) lbl.textContent = 'Copied';
      toast('Embed snippet copied to clipboard.', 'success');
      setTimeout(() => { const l = $('#copy-label'); if (l) l.textContent = 'Copy'; }, 2000);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done).catch(() => fallbackCopy(code, done));
    } else fallbackCopy(code, done);
  },

  toggleChecklist(i) {
    const t = currentTenant();
    if (!t) return;
    const key = t.id + ':' + i;
    if (state.checkedSteps.has(key)) state.checkedSteps.delete(key);
    else state.checkedSteps.add(key);
    renderContent();
  }
};
window.UI = UI;
function mockTenantSafe(id) { return PREVIEW ? mockTenant(id) : null; }
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('Copy failed — select the code manually.', 'error'); }
  document.body.removeChild(ta);
}

/* ================= init ================= */
(async function init() {
  if (PREVIEW) $('#preview-badge').classList.remove('hidden');
  try {
    state.tenants = await apiGet('/api/tenants');
  } catch (e) {
    toast(e.message, 'error');
    $('#content').innerHTML = errorBlock(e.message + ' — the dashboard talks to the same origin it is served from.', null);
    renderSidebar(); renderHeader(); renderTabs();
    return;
  }
  renderSidebar(); renderHeader(); renderTabs(); renderContent();
  if (state.tenants.length) UI.selectTenant(state.tenants[0].id);
})();
</script>
